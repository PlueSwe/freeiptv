name: Update IPTV master playlist

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "15 4 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build master playlist
        run: python3 build_master_m3u.py

      - name: Commit updated playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add master.m3u sweden.m3u
          if git diff --cached --quiet; then
            echo "No playlist changes."
            exit 0
          fi
          git commit -m "Update IPTV playlists"
          git push
